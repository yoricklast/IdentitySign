<!doctype html>
<html lang="en">
  <head>
    <title>IdentitySign</title>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/img/logo.svg" />
    <meta name="viewport" content="width=device-width" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
      crossorigin="anonymous"
    ></script>
    <script src="../yivi/yivi.js" type="text/javascript"></script>
    %sveltekit.head%
  </head>

  <header
    class="d-flex flex-wrap justify-content-center py-3 mb-4"
    style="padding-left: 25px; padding-right: 25px"
  >
    <a
      href="/"
      class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
    >
      <img class="logo" src="/img/logo.svg" />
      <span class="fs-3 logo-text">IdentitySign</span>
    </a>

    <ul class="nav nav-pills">
      <li class="nav-item main-nav">
        <a href="/" class="nav-link" aria-current="page">
          <i class="bi bi-house icon-nav"></i>
          Home
        </a>
      </li>
      <li class="nav-item main-nav">
        <a href="/sign" class="nav-link">
          <i class="bi bi-pencil-square icon-nav"></i>
          Sign a document
        </a>
      </li>
      <li class="nav-item main-nav">
        <a href="/verify" class="nav-link">
          <i
            class="bi bi-file-earmark-check icon-nav"
            style="margin-right: 1px"
          ></i>
          Verify a signature
        </a>
      </li>
      <li class="nav-item main-nav">
        <a href="/request" class="nav-link">
          <i
            class="bi bi-envelope-check icon-nav"
            style="margin-right: 1px"
          ></i>
          Request a signature
        </a>
      </li>
      <li class="nav-item main-nav">
        <a href="/about" class="nav-link">
          <i class="bi bi-info-circle icon-nav"></i>
          About
        </a>
      </li>
      <li class="nav-item main-nav" id="setupNavItem">
        <a href="/setup" class="nav-link setupNavLink">
          <i
            class="bi bi-gear-wide-connected icon-nav"
            style="margin-right: 1px"
          ></i>
          Setup
        </a>
      </li>
    </ul>
  </header>

  <body data-sveltekit-preload-data="hover">
    <div class="main-div">
      <div style="display: contents">%sveltekit.body%</div>
    </div>
    <div class="impressum">
      <a href="https://www.uni-paderborn.de/impressum" target="_blank"
        >Impressum</a
      >
    </div>
  </body>

  <footer>
    <nav class="navbar fixed-bottom nav-bottom">
      <div class="container-fluid">
        <a class="navbar-text nav-bottom-text" href="/about">
          Please note: this is a prototype application, it does
          <b>not</b> create actual signatures!
        </a>
      </div>
    </nav>
  </footer>

  <script>
    if (localStorage.getItem("devMode") != "true") {
      document.getElementById("setupNavItem").style.display = "none";
    }
    try {
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      }
    } catch {
      console.warn("Could not detect or set dark/light mode.");
    }
  </script>
</html>

<style>
  @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css");
  @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap");
  body {
    font-family: "Open Sans", sans-serif;
    padding-bottom: 75px;
  }
  h1 {
    font-size: 35px;
    font-weight: 650;
    margin-bottom: 15px;
  }
  h2 {
    font-size: 28px;
    font-weight: 500;
  }
  h3 {
    font-size: 22px;
    font-weight: 700;
  }
  .logo {
    height: 30px;
  }
  .main-div {
    padding-left: 12%;
    padding-right: 12%;
  }
  .main-text {
    font-size: 20px;
    margin-bottom: 30px;
  }
  .main-nav {
    font-size: 18px;
    font-weight: 550;
  }
  .icon-nav {
    width: 1em;
    margin-right: 2px;
  }
  .main-navbar {
    background-color: var(--bs-primary-bg-subtle);
  }
  .logo-text {
    font-weight: 500;
  }
  .page-icon {
    display: inline-block;
    margin-bottom: 5px;
    font-size: 40px;
    margin-right: 10px;
  }
  .page-image {
    width: 100%;
    padding-right: 50px;
  }
  .page-image-r {
    width: 100%;
    padding-left: 30px;
  }
  .nav-bottom {
    background-color: var(--bs-body-bg);
  }
  .nav-bottom-text {
    width: 100%;
    text-decoration: none;
    text-align: center;
    color: var(--bs-danger);
  }
  .setupNavLink {
    color: var(--bs-secondary);
  }
  .narrower {
    max-width: 800px;
  }
  .infoblock {
    padding: 25px;
    background-color: var(--bs-tertiary-bg);
    margin-bottom: 20px;
  }
  .infoblock-text {
    margin-bottom: 0px;
  }
  .attribute-heading {
    margin-bottom: 15px;
  }
  .attribute-card {
    margin-bottom: 15px;
  }
  .card-icon {
    margin-right: 10px;
    color: var(--bs-primary);
  }
  .impressum {
    width: 100%;
    margin-top: 20px;
    font-size: 11pt;
    text-align: center;
  }
</style>
